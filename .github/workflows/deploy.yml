name: Deploy to EC2

on:
  push:
    branches: ["main"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:latest
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and push Frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:latest
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            # Login to GHCR on the server
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Navigate to app directory (Adjust this path if your docker-compose.yml is elsewhere)
            cd ~/CourseFlow || mkdir -p ~/CourseFlow && cd ~/CourseFlow

            # Pull latest images
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:latest
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:latest

            # Restart containers
            # We assume docker-compose.yml is already present or we might need to copy it.
            # Ideally, we should copy the docker-compose.yml from the repo to the server.
            # For robust deployment, let's clone/pull the repo or copy the file.
            # Simpler approach for now:

            # Stop existing
            docker compose down || true

            # Update docker-compose.yml referencing the GHCR images? 
            # Or just rely on local build if we are pulling? 
            # Wait, the docker-compose.yml usually points to local Dockerfiles or specific images.
            # We should update it to point to GHCR images or override it.

            # Let's assume the user will scp the docker-compose.yml or git pull.
            # Let's add a git pull step if it's a git repo.
            if [ -d ".git" ]; then
              git pull origin main
            fi

            # Force pull and up
            docker compose pull
            docker compose up -d
