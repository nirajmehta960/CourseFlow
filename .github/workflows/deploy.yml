name: Deploy to EC2

on:
  push:
    branches: ["main"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repo name
        run: |
          echo "REPO_LOWER=${GITHUB_REPOSITORY@L}" >> ${GITHUB_ENV}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Build Backend with Maven
        run: |
          cd backend
          mvn clean package -DskipTests

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          export VITE_API_BASE_URL=/api
          npm run build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          platforms: linux/arm64
          tags: ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/backend:latest

      - name: Build and push Frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          platforms: linux/arm64
          tags: ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/frontend:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Lowercase repo name
        run: |
          echo "REPO_LOWER=${GITHUB_REPOSITORY@L}" >> ${GITHUB_ENV}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          REGISTRY: ghcr.io
          REPO_LOWER: ${{ env.REPO_LOWER }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          envs: REGISTRY,REPO_LOWER,GITHUB_TOKEN,GITHUB_ACTOR
          script: |
            # Login to GHCR on the server
            echo ${GITHUB_TOKEN} | docker login ghcr.io -u ${GITHUB_ACTOR} --password-stdin

            # Navigate to app directory or clone if it doesn't exist
            if [ ! -d "$HOME/CourseFlow" ]; then
              cd "$HOME"
              git clone https://github.com/${REPO_LOWER}.git CourseFlow
            fi

            cd "$HOME/CourseFlow"

            # Pull latest code
            git pull origin main

            # Ensure .env file exists for docker-compose to satisfy file checks
            # (User should manually populate this file with real secrets on the server)
            mkdir -p backend
            touch backend/.env

            # Pull latest images from GHCR
            docker pull ${REGISTRY}/${REPO_LOWER}/backend:latest
            docker pull ${REGISTRY}/${REPO_LOWER}/frontend:latest

            # Tag the GHCR images to match what docker-compose expects with :latest
            docker tag ${REGISTRY}/${REPO_LOWER}/backend:latest courseflow-backend:latest
            docker tag ${REGISTRY}/${REPO_LOWER}/frontend:latest courseflow-frontend:latest

            # Restart containers with the new images
            docker-compose down || true
            docker rm -f courseflow-backend courseflow-frontend || true
            docker-compose up -d --force-recreate
