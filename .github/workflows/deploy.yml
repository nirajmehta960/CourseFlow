name: Deploy to EC2

on:
  push:
    branches: ["main"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repo name
        run: |
          echo "REPO_LOWER=${GITHUB_REPOSITORY@L}" >> ${GITHUB_ENV}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}

      - name: Build and push Backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/backend:latest
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and push Frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/frontend:latest
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Lowercase repo name
        run: |
          echo "REPO_LOWER=${GITHUB_REPOSITORY@L}" >> ${GITHUB_ENV}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          REGISTRY: ghcr.io
          REPO_LOWER: ${{ env.REPO_LOWER }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          envs: REGISTRY,REPO_LOWER,GITHUB_TOKEN,GITHUB_ACTOR
          script: |
            # Login to GHCR on the server
            echo ${GITHUB_TOKEN} | docker login ghcr.io -u ${GITHUB_ACTOR} --password-stdin

            # Navigate to app directory or clone if it doesn't exist
            if [ ! -d "$HOME/CourseFlow" ]; then
              cd "$HOME"
              git clone https://github.com/${REPO_LOWER}.git CourseFlow
            fi

            cd "$HOME/CourseFlow"

            # Pull latest code
            git pull origin main

            # Ensure .env file exists for docker-compose to satisfy file checks
            # (User should manually populate this file with real secrets on the server)
            mkdir -p backend
            touch backend/.env

            # Pull latest images from GHCR
            docker pull ${REGISTRY}/${REPO_LOWER}/backend:latest
            docker pull ${REGISTRY}/${REPO_LOWER}/frontend:latest

            # Tag the GHCR images to match what docker-compose expects
            docker tag ${REGISTRY}/${REPO_LOWER}/backend:latest courseflow-backend
            docker tag ${REGISTRY}/${REPO_LOWER}/frontend:latest courseflow-frontend

            # Restart containers with the new images
            docker-compose down || true
            docker rm -f courseflow-backend courseflow-frontend || true
            docker-compose up -d
