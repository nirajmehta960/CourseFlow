services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: courseflow-backend
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    environment:
      - SERVER_PORT=4000
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: courseflow-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
