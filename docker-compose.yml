services:
  backend:
    build: ./backend
    image: courseflow-backend:latest
    container_name: courseflow-backend
    ports:
      - "4000:4000"
    expose:
      - "4000"
    env_file:
      - ./backend/.env
    environment:
      - SERVER_PORT=4000
      - SPRING_PROFILES_ACTIVE=prod
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4000/api/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - courseflow-network
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: courseflow-frontend:latest
    container_name: courseflow-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - courseflow-network
    restart: unless-stopped

networks:
  courseflow-network:
    driver: bridge
